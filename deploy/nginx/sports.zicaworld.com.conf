# Reverse proxy for sports.zicaworld.com -> the Next server on 127.0.0.1:3000
#
# Install as /etc/nginx/sites-available/sports.zicaworld.com and symlink into
# sites-enabled. `provision.sh` does both.
#
# The forwarded headers below are not boilerplate — the application reads three of
# them and misbehaves without them:
#
#   X-Forwarded-Proto  Next uses it to build absolute URLs and to know the request
#                      arrived over TLS even though this hop is plain HTTP.
#   X-Forwarded-Host   The CSRF check compares the browser's `Origin` against this.
#                      Omit it and every POST is rejected as cross-site, which reads
#                      as "the app is broken" rather than "a header is missing".
#   X-Forwarded-For    `clientIp` reads TRUSTED_PROXY_HOPS entries from the RIGHT of
#                      this list. With one nginx, set TRUSTED_PROXY_HOPS=1.
#
# Security response headers are deliberately NOT set here. The app sets them itself,
# including a per-request CSP nonce that nginx cannot generate. Adding a second,
# static CSP here would override the nonce and break React hydration.

upstream sports_scheduler {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Plain HTTP: only ever used for the ACME challenge and to redirect.
server {
    listen 80;
    listen [::]:80;
    server_name sports.zicaworld.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sports.zicaworld.com;

    # certbot rewrites these two paths when it issues the certificate.
    ssl_certificate     /etc/letsencrypt/live/sports.zicaworld.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sports.zicaworld.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # A roster CSV import is the largest legitimate body. The application caps JSON
    # bodies at 2 MB itself; this is the outer bound so nginx rejects an oversized
    # upload before it reaches Node at all.
    client_max_body_size 4m;

    # The scheduling engine can take a while on a large season. The default 60s
    # gateway timeout turns a slow generation into a 504 halfway through a write.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Next serves fingerprinted, immutable assets under this prefix.
    location /_next/static/ {
        proxy_pass http://sports_scheduler;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://sports_scheduler;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keep-alive to the upstream; `Connection: ""` is required with keepalive.
        proxy_set_header Connection "";

        # Streamed RSC payloads should reach the browser as they are produced rather
        # than being held until complete.
        proxy_buffering off;
    }
}

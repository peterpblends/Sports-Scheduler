name: CI

# Least privilege. Declared at the top level so a job added later inherits read-only
# rather than the repository default, which is often write-all.
permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite runs against real Postgres rather than a mock, because every
    # authorization path is a database query and mocking them would test nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduler_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scheduler?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scheduler_test?schema=public
      APP_URL: http://localhost:3000
      MAIL_TRANSPORT: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint is a real gate now. It used to be a no-op: `next lint` with no config
      # dropped into an interactive prompt, so nothing was ever checked.
      - name: Lint
        run: npm run lint

      # Fails the build on a known-vulnerable dependency rather than waiting for
      # someone to run this by hand.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
